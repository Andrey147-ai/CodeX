name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o codex${{ runner.os == 'Windows' && '.exe' || '' }} .

      - name: Smoke test examples
        shell: bash
        run: |
          ./codex${{ runner.os == 'Windows' && '.exe' || '' }} examples/raid.cx
          ./codex${{ runner.os == 'Windows' && '.exe' || '' }} examples/inventory.cx
          ./codex${{ runner.os == 'Windows' && '.exe' || '' }} examples/methods.cx
          echo "ci-user" | ./codex${{ runner.os == 'Windows' && '.exe' || '' }} examples/stdlib.cx
