<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" font-family="Consolas, Menlo, monospace">
  <rect width="720" height="320" rx="14" fill="#0d1117"/>
  <rect x="1" y="1" width="718" height="318" rx="13" fill="none" stroke="#30363d" stroke-width="2"/>
  <circle cx="28" cy="26" r="7" fill="#ff5f57"/>
  <circle cx="50" cy="26" r="7" fill="#febc2e"/>
  <circle cx="72" cy="26" r="7" fill="#28c840"/>
  <text x="96" y="31" font-size="14" fill="#8b949e">codex — живое демо</text>
  <g font-size="17">
    <text x="24" y="70" fill="#3ddc84">$<tspan fill="#e6edf3"> codex new hello.cx</tspan><tspan fill="#58a6ff"><animate attributeName="opacity" values="1;1" dur="20s" repeatCount="indefinite"/></tspan></text>
    <text x="24" y="100" fill="#8b949e" opacity="0">ok hello.cx — запусти: codex hello.cx<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.08;0.12;1" dur="20s" repeatCount="indefinite"/></text>
    <text x="24" y="130" fill="#3ddc84" opacity="0">$<tspan fill="#e6edf3"> codex guess.cx</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2;0.24;1" dur="20s" repeatCount="indefinite"/></text>
    <text x="24" y="160" fill="#e6edf3" opacity="0">Я загадал 1..100. Твой вариант: 50 → Бери больше<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.32;0.36;1" dur="20s" repeatCount="indefinite"/></text>
    <text x="24" y="190" fill="#e6edf3" opacity="0">Твой вариант: 75 → Точно! Это 75 за 2 попытки<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.44;0.48;1" dur="20s" repeatCount="indefinite"/></text>
    <text x="24" y="220" fill="#3ddc84" opacity="0">$<tspan fill="#e6edf3"> codex mini_api.cx</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.56;0.6;1" dur="20s" repeatCount="indefinite"/></text>
    <text x="24" y="250" fill="#8b949e" opacity="0">API on 127.0.0.1:8081/hi → {"hi": "there"}<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.68;0.72;1" dur="20s" repeatCount="indefinite"/></text>
    <text x="24" y="280" fill="#a06bff" opacity="0">★ github.com/Andrey147-ai/CodeX<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.8;0.84;1" dur="20s" repeatCount="indefinite"/></text>
    <rect x="24" y="292" width="12" height="18" fill="#58a6ff" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.1;0.9" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
